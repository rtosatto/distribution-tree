<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sendio Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #080a12;
    --bg-glow: radial-gradient(ellipse 1100px 650px at 50% 28%, #151b38 0%, transparent 68%);
    --panel-bg: rgba(13,15,26,0.74);
    --panel-border: rgba(140,150,220,0.11);
    --line: #e8ecf8;
    --line-dim: #838bb2;
    --wood: #7c6cf0;
    --enterprise: #a78bfa;
    --affiliate: #2dd4bf;
    --founder: #fb923c;
    --churn: #9a6a8a;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html, body{ margin:0; padding:0; height:100%; background:var(--bg); }
  .tree-app{
    background:var(--bg) var(--bg-glow);
    color:var(--line);
    font-family:'Inter',sans-serif;
    border-radius:0;
    display:grid;
    grid-template-columns: 300px 1fr;
    height:100vh;
    min-height:600px;
    overflow:hidden;
    border:none;
    position:relative;
  }
  @media (max-width: 860px){
    .tree-app{ grid-template-columns: 1fr; height:auto; min-height:100vh; }
    .panel{ max-height:340px; }
  }
  .panel{
    background:var(--panel-bg);
    backdrop-filter:blur(14px);
    border-right:1px solid var(--panel-border);
    padding:24px 20px;
    overflow-y:auto;
    height:100%;
    scrollbar-width:thin;
  }
  .panel::-webkit-scrollbar{ width:6px; }
  .panel::-webkit-scrollbar-thumb{ background:#333; border-radius:3px; }

  .brand{ font-family:'Fraunces',serif; font-size:21px; font-weight:600; letter-spacing:-0.01em; margin:0 0 2px 0; }
  .brand-sub{ font-size:11px; color:var(--line-dim); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.09em; margin:0 0 22px 0; }
  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--line-dim); margin:24px 0 12px 0; display:flex; align-items:center; gap:6px; }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--panel-border); }

  .channel-card{ background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .channel-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .swatch{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
  .channel-row label{ font-size:12.5px; flex:1; font-weight:500; }
  .channel-row .num{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--line-dim); min-width:26px; text-align:right; }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:3px; border-radius:2px; background:rgba(255,255,255,0.12); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--line); cursor:pointer; border:2px solid var(--bg);
  }

  .stat-block{ background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:12px; padding:13px 14px; margin-bottom:6px; }
  .stat-row{ display:flex;justify-content:space-between; font-size:12px; font-family:'IBM Plex Mono',monospace; color:var(--line-dim); padding:3px 0; }
  .stat-row b{ color:var(--line); font-weight:500; }

  form.add-form{ display:flex; flex-direction:column; gap:9px; }
  .add-form input, .add-form select{
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); color:var(--line);
    border-radius:8px; padding:8px 10px; font-size:12.5px; font-family:'Inter',sans-serif; width:100%;
    transition:border-color 0.15s;
  }
  .add-form input:focus, .add-form select:focus{ outline:none; border-color:var(--wood); }
  select option{ background-color:#14172a; color:var(--line); }
  select option:checked{ background-color:#4f3fc4; color:#fff; }
  .add-form label{ font-size:10.5px; color:var(--line-dim); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; display:block; }
  .add-btn{
    margin-top:4px; background:linear-gradient(135deg, var(--wood), #4f3fc4); border:none; color:#fff; font-weight:600;
    padding:10px 10px; border-radius:8px; cursor:pointer; font-size:12.5px; font-family:'Inter',sans-serif;
    transition:filter 0.15s, transform 0.1s;
  }
  .add-btn:hover{ filter:brightness(1.15); }
  .add-btn:active{ transform:scale(0.98); }

  .client-list{ margin-top:16px; display:flex; flex-direction:column; gap:5px; }
  .list-group{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--line-dim); opacity:0.75; margin:10px 0 2px 2px; }
  .list-group:first-child{ margin-top:0; }
  .client-item{ display:flex; align-items:center; gap:8px; font-size:11.5px; padding:7px 9px; border-radius:8px; background:rgba(255,255,255,0.02); cursor:pointer; transition:background 0.15s; }
  .client-item:hover{ background:rgba(255,255,255,0.06); }
  .client-item.is-opp .name{ color:var(--line-dim); }
  .client-item .dot{ width:7px;height:7px;border-radius:50%; flex-shrink:0; }
  .client-item .name{ flex:1; color:var(--line); }
  .client-item .val{ color:var(--line-dim); font-family:'IBM Plex Mono',monospace; }
  .client-item .del{ color:var(--line-dim); background:none; border:none; cursor:pointer; font-size:14px; padding:0 2px; line-height:1; }
  .client-item .del:hover{ color:var(--churn); }

  .canvas-wrap{ position:relative; }
  .save-indicator{ position:absolute; top:24px; right:26px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--line-dim); opacity:0; transition:opacity 0.3s; z-index:4; pointer-events:none; }
  .save-indicator.show{ opacity:0.7; }

  /* neural cortex chrome */
  .cortex-panel{
    position:absolute; top:18px; left:20px; z-index:4;
    background:var(--panel-bg); backdrop-filter:blur(14px);
    border:1px solid var(--panel-border); border-radius:12px; padding:11px 14px 10px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
  }
  .cortex-row{ display:flex; align-items:center; gap:9px; }
  .cortex-logo{ width:16px; height:16px; color:var(--enterprise); filter:drop-shadow(0 0 6px rgba(167,139,250,0.7)); }
  .cortex-name{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.16em; color:var(--line); }
  .cortex-badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--enterprise); background:rgba(167,139,250,0.14); border:1px solid rgba(167,139,250,0.3); border-radius:20px; padding:1px 8px; }
  .equalizer{ display:flex; align-items:flex-end; gap:2px; height:22px; margin-top:9px; }
  .equalizer i{ width:3px; border-radius:1px; background:linear-gradient(to top, var(--enterprise), var(--affiliate)); height:30%; animation:eq 1s ease-in-out infinite; }
  @keyframes eq{ 0%,100%{ height:22%; opacity:0.6; } 50%{ height:100%; opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .equalizer i{ animation:none; height:55%; } }

  .zoom-controls{ position:absolute; left:20px; bottom:74px; z-index:4; display:flex; flex-direction:column; gap:6px; }
  .zbtn{
    width:34px; height:34px; border-radius:9px; background:var(--panel-bg); backdrop-filter:blur(14px);
    border:1px solid var(--panel-border); color:var(--line); font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:border-color 0.15s, background 0.15s;
  }
  .zbtn:hover{ border-color:var(--enterprise); background:rgba(167,139,250,0.12); }
  .zbtn:active{ transform:scale(0.94); }

  .cortex-caption{
    position:absolute; left:20px; bottom:22px; z-index:4;
    background:var(--panel-bg); backdrop-filter:blur(14px); border:1px solid var(--panel-border);
    border-radius:9px; padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.05em; color:var(--line-dim);
  }

  .canvas-wrap{ height:100%; }
  svg{ display:block; width:100%; height:100%; touch-action:none; }
  @keyframes bob{
    0%,100%{ transform: translateY(0px) rotate(0deg); }
    50%{ transform: translateY(-7px) rotate(-2deg); }
  }
  @keyframes swing{
    0%{ transform: rotate(0deg); }
    25%{ transform: rotate(-9deg); }
    55%{ transform: rotate(7deg); }
    80%{ transform: rotate(-3deg); }
    100%{ transform: rotate(0deg); }
  }
  @keyframes flow{ to{ stroke-dashoffset: -24; } }
  .flow{ animation: flow 1.7s linear infinite; }
  @media (prefers-reduced-motion: reduce){ .flow{ animation:none; } }
  .bubble{
    cursor:grab;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: bob var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .bubble:hover{ animation: swing 0.6s ease-in-out; }
  .bubble.dragging{ animation:none; }
  .bubble.settle{ animation: swing 0.5s ease-out; }
  .bubble:active{ cursor:grabbing; }
  .bubble circle.core{ transition:filter 0.15s; }
  .bubble:hover circle.core{ filter:brightness(1.1); }

  .detail-card{
    position:absolute; bottom:22px; right:22px; width:264px;
    background:var(--panel-bg); backdrop-filter:blur(14px); border:1px solid var(--panel-border);
    border-radius:14px; padding:16px 17px 15px; font-size:12px; display:none; z-index:3;
  }
  .detail-card.show{ display:block; }
  .detail-card .close{ position:absolute; top:9px; right:11px; background:none; border:none; color:var(--line-dim); cursor:pointer; font-size:15px; line-height:1; z-index:2; }
  .detail-card label{ font-size:9.5px; color:var(--line-dim); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 3px 2px; display:block; }
  .detail-card .d-title{
    font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--line);
    background:transparent; border:none; border-bottom:1px solid transparent; width:calc(100% - 16px);
    padding:0 0 4px 0; margin-bottom:12px; transition:border-color 0.15s;
  }
  .detail-card .d-title:focus{ outline:none; border-bottom-color:var(--wood); }
  .detail-card .d-title::placeholder{ color:var(--line-dim); opacity:0.5; }
  .detail-card input, .detail-card select{
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); color:var(--line);
    border-radius:7px; padding:7px 9px; font-size:12px; font-family:'Inter',sans-serif; width:100%;
    transition:border-color 0.15s;
  }
  .detail-card input:focus, .detail-card select:focus{ outline:none; border-color:var(--wood); }
  .detail-card > input:not(.d-title), .detail-card > label{ margin-bottom:9px; }
  .detail-card > label{ margin-bottom:3px; }
  .d-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:10px; }
  .detail-card .d-delete{ margin-top:12px; width:100%; background:none; border:1px solid var(--panel-border); color:var(--line-dim); border-radius:8px; padding:8px; font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em; cursor:pointer; transition:color 0.15s, border-color 0.15s, background 0.15s; }
  .detail-card .d-delete:hover{ color:#e0b4b4; border-color:var(--churn); background:rgba(138,90,90,0.12); }
</style>
</head>
<body>


<div class="tree-app">
  <div class="panel">
    <p class="brand">The Sendio Tree</p>
    <p class="brand-sub">Roots in, clients up</p>

    <div class="section-label">Weekly volume</div>
    <div id="channelInputs"></div>

    <div class="section-label">Overview</div>
    <div class="stat-block" id="statBlock"></div>

    <div class="section-label">Add a client</div>
    <form class="add-form" id="addForm">
      <div>
        <label>Name</label>
        <input type="text" id="f-name" placeholder="e.g. Bright Data" required />
      </div>
      <div>
        <label>Channel</label>
        <select id="f-channel">
          <option value="enterprise">Enterprise</option>
          <option value="affiliate">Affiliate</option>
          <option value="founder">Founder</option>
        </select>
      </div>
      <div>
        <label>Stage</label>
        <select id="f-stage">
          <option value="opportunity">Opportunity — roots</option>
          <option value="client">Client — canopy</option>
        </select>
      </div>
      <div>
        <label>Tactic</label>
        <input type="text" id="f-tactic" placeholder="e.g. Paid consult, cold LinkedIn" />
      </div>
      <div>
        <label>Value (seats / subs)</label>
        <input type="number" id="f-value" min="1" value="1" />
      </div>
      <div>
        <label>Status</label>
        <select id="f-status">
          <option value="active">Active</option>
          <option value="closing">Closing</option>
          <option value="churned">Churned</option>
        </select>
      </div>
      <button type="submit" class="add-btn">Add to the tree</button>
    </form>

    <div class="section-label">Clients</div>
    <div class="client-list" id="clientList"></div>
  </div>

  <div class="canvas-wrap">
    <div class="cortex-panel">
      <div class="cortex-row">
        <svg class="cortex-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 0 3 3 0 0 0 2-5 3 3 0 0 0-2-5 3 3 0 0 0-3-3Z"/><path d="M12 6v13M9 11h6M8 16h8"/></svg>
        <span class="cortex-name">SENDIO CORTEX</span>
        <span class="cortex-badge" id="nodeCount">0</span>
      </div>
      <div class="equalizer" id="equalizer"></div>
    </div>
    <div class="save-indicator" id="saveIndicator">saved</div>
    <svg id="tree" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoom-controls">
      <button class="zbtn" id="zoomIn" title="Zoom in">+</button>
      <button class="zbtn" id="zoomOut" title="Zoom out">&minus;</button>
    </div>
    <div class="cortex-caption">synaptic mesh · drag nodes · click to inspect</div>
    <div class="detail-card" id="detailCard">
      <button class="close" id="detailClose">&times;</button>
      <input class="d-title" id="d-name" placeholder="Name" />
      <div class="d-grid">
        <div>
          <label>Stage</label>
          <select id="d-stage">
            <option value="opportunity">Opportunity</option>
            <option value="client">Client</option>
          </select>
        </div>
        <div>
          <label>Channel</label>
          <select id="d-channel">
            <option value="enterprise">Enterprise</option>
            <option value="affiliate">Affiliate</option>
            <option value="founder">Founder</option>
          </select>
        </div>
      </div>
      <label>Tactic</label>
      <input id="d-tactic" placeholder="e.g. Paid consult, cold LinkedIn" />
      <div class="d-grid">
        <div>
          <label>Value</label>
          <input id="d-value" type="number" min="1" />
        </div>
        <div>
          <label>Status</label>
          <select id="d-status">
            <option value="active">Active</option>
            <option value="closing">Closing</option>
            <option value="churned">Churned</option>
          </select>
        </div>
      </div>
      <button class="d-delete" id="d-delete">Delete from tree</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'growth-tree-data-v2';
  const CHANNELS = {
    enterprise: { label:'Enterprise', accent:'#a78bfa' },
    affiliate:  { label:'Affiliate',  accent:'#2dd4bf' },
    founder:    { label:'Founder',    accent:'#fb923c' }
  };

  let data = {
    volumes: { enterprise: 50, affiliate: 15, founder: 80 },
    clients: [
      // canopy — converted clients
      { id:'seed-1', name:'50-rep account', channel:'enterprise', tactic:'ABM outbound', value:45, status:'closing', stage:'client', dx:0, dy:0 },
      { id:'seed-2', name:'Charlie', channel:'affiliate', tactic:'Paid consult (Upwork)', value:7, status:'active', stage:'client', dx:0, dy:0 },
      { id:'seed-3', name:'Guideless', channel:'founder', tactic:'Cold LinkedIn', value:2, status:'active', stage:'client', dx:0, dy:0 },
      // roots — opportunities in the pipeline
      { id:'opp-1', name:'Acme Corp', channel:'enterprise', tactic:'Discovery booked', value:20, status:'active', stage:'opportunity', dx:0, dy:0 },
      { id:'opp-2', name:'GrowthMentor lead', channel:'affiliate', tactic:'Paid consult set', value:5, status:'active', stage:'opportunity', dx:0, dy:0 },
      { id:'opp-3', name:'Indie SaaS founder', channel:'founder', tactic:'Replied to DM', value:2, status:'active', stage:'opportunity', dx:0, dy:0 }
    ]
  };

  function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h=(Math.imul(31,h)+str.charCodeAt(i))|0; } return h; }
  function seededRandom(seed){
    let t = seed + 0x6D2B79F5;
    return function(){
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
  function shade(hex, amt){
    hex = hex.replace('#','');
    const num = parseInt(hex,16);
    const r = (num>>16)&255, g=(num>>8)&255, b=num&255;
    const f = (c)=> amt>=0 ? c+(255-c)*amt : c*(1+amt);
    return `rgb(${clamp(Math.round(f(r)),0,255)},${clamp(Math.round(f(g)),0,255)},${clamp(Math.round(f(b)),0,255)})`;
  }

  let saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        const ind = document.getElementById('saveIndicator');
        ind.classList.add('show');
        setTimeout(()=>ind.classList.remove('show'), 900);
      }catch(e){ console.error('save failed', e); }
    }, 200);
  }
  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed && parsed.volumes && parsed.clients){
          parsed.clients.forEach(c=>{ if (c.dx===undefined) c.dx=0; if (c.dy===undefined) c.dy=0; if (!c.stage) c.stage='client'; });
          data = parsed;
        }
      }
    }catch(e){ /* no saved data yet, keep seed */ }
  }

  function renderChannelInputs(){
    const wrap = document.getElementById('channelInputs');
    wrap.innerHTML = '';
    Object.keys(CHANNELS).forEach(key=>{
      const ch = CHANNELS[key];
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.innerHTML = `
        <div class="channel-row">
          <span class="swatch" style="background:${ch.accent}"></span>
          <label>${ch.label}</label>
          <span class="num" id="num-${key}">${data.volumes[key]}</span>
        </div>
        <input type="range" min="0" max="150" value="${data.volumes[key]}" data-channel="${key}" />
      `;
      wrap.appendChild(card);
    });
    wrap.querySelectorAll('input[type=range]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const key = e.target.getAttribute('data-channel');
        data.volumes[key] = Number(e.target.value) || 0;
        document.getElementById('num-'+key).textContent = data.volumes[key];
        renderTree();
        renderStats();
        save();
      });
    });
  }

  function renderStats(){
    const totalVolume = Object.values(data.volumes).reduce((a,b)=>a+b,0);
    const canopy = data.clients.filter(c=>c.stage!=='opportunity' && c.status!=='churned');
    const roots = data.clients.filter(c=>c.stage==='opportunity');
    const totalValue = canopy.reduce((a,c)=>a+Number(c.value||0),0);
    const byChannel = {};
    Object.keys(CHANNELS).forEach(k=>byChannel[k]=0);
    canopy.forEach(c=>{ byChannel[c.channel] = (byChannel[c.channel]||0) + Number(c.value||0); });

    const block = document.getElementById('statBlock');
    block.innerHTML = `
      <div class="stat-row"><span>Total weekly volume</span><b>${totalVolume}</b></div>
      <div class="stat-row"><span>Clients in canopy</span><b>${canopy.length}</b></div>
      <div class="stat-row"><span>Opportunities in roots</span><b>${roots.length}</b></div>
      <div class="stat-row"><span>Total seats/subs</span><b>${totalValue}</b></div>
      ${Object.keys(CHANNELS).map(k=>`<div class="stat-row"><span>${CHANNELS[k].label} seats</span><b>${byChannel[k]}</b></div>`).join('')}
    `;
    const nc = document.getElementById('nodeCount');
    if (nc) nc.textContent = data.clients.length;
  }

  function renderClientList(){
    const list = document.getElementById('clientList');
    list.innerHTML = '';
    const groups = [
      { key:'client', label:'Canopy · clients', items: data.clients.filter(c=>c.stage!=='opportunity') },
      { key:'opportunity', label:'Roots · opportunities', items: data.clients.filter(c=>c.stage==='opportunity') }
    ];
    groups.forEach(group=>{
      if (!group.items.length) return;
      const head = document.createElement('div');
      head.className = 'list-group';
      head.textContent = group.label;
      list.appendChild(head);
      group.items.forEach(c=>{
        const item = document.createElement('div');
        item.className = 'client-item' + (c.stage==='opportunity' ? ' is-opp' : '');
        const acc = CHANNELS[c.channel].accent;
        const dotStyle = c.stage==='opportunity'
          ? `background:transparent; box-shadow:inset 0 0 0 1.5px ${acc}; opacity:${c.status==='churned'?0.35:1}`
          : `background:${acc}; opacity:${c.status==='churned'?0.35:1}`;
        item.innerHTML = `
          <span class="dot" style="${dotStyle}"></span>
          <span class="name">${c.name}</span>
          <span class="val">${c.value}</span>
          <button class="del" data-id="${c.id}">&times;</button>
        `;
        item.addEventListener('click', (e)=>{
          if (e.target.classList.contains('del')) return;
          showDetail(c);
        });
        list.appendChild(item);
      });
    });
    list.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        data.clients = data.clients.filter(c=>c.id!==id);
        renderAll();
        save();
      });
    });
  }

  let selectedId = null;
  function showDetail(c){
    selectedId = c.id;
    document.getElementById('d-name').value = c.name;
    document.getElementById('d-stage').value = c.stage==='opportunity' ? 'opportunity' : 'client';
    document.getElementById('d-channel').value = c.channel;
    document.getElementById('d-tactic').value = c.tactic || '';
    document.getElementById('d-value').value = c.value;
    document.getElementById('d-status').value = c.status;
    document.getElementById('detailCard').classList.add('show');
  }
  document.getElementById('detailClose').addEventListener('click', ()=>{
    document.getElementById('detailCard').classList.remove('show');
    selectedId = null;
  });

  function bindDetailEditors(){
    const apply = ()=>{
      const c = data.clients.find(x=>x.id===selectedId);
      if (!c) return;
      const prevStage = c.stage;
      c.name = document.getElementById('d-name').value;
      c.stage = document.getElementById('d-stage').value;
      c.channel = document.getElementById('d-channel').value;
      c.tactic = document.getElementById('d-tactic').value.trim();
      c.value = Number(document.getElementById('d-value').value) || 1;
      c.status = document.getElementById('d-status').value;
      if (prevStage !== c.stage){ c.dx = 0; c.dy = 0; }
      renderTree(); renderStats(); renderClientList();
      save();
    };
    ['d-name','d-tactic','d-value'].forEach(id=>document.getElementById(id).addEventListener('input', apply));
    ['d-stage','d-channel','d-status'].forEach(id=>document.getElementById(id).addEventListener('change', apply));
    document.getElementById('d-delete').addEventListener('click', ()=>{
      if (!selectedId) return;
      data.clients = data.clients.filter(x=>x.id!==selectedId);
      selectedId = null;
      document.getElementById('detailCard').classList.remove('show');
      renderAll();
      save();
    });
  }

  function bezier(p0,p1,p2,p3){
    return `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`;
  }

  function toSvgPoint(svg, clientX, clientY){
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  let dragState = null;
  let dragAngles = {};
  let lastLayout = null;
  let zoom = 1;
  let meshCache = { w:0, h:0, str:'' };

  function bubbleMarkup(c, bx, by){
    const acc = CHANNELS[c.channel].accent;
    const r = seededRandom(hashSeed(c.id));
    const radius = clamp(10 + Number(c.value||1)*1.0, 13, 40);
    const isChurned = c.status === 'churned';
    const gOp = isChurned ? 0.4 : 1;
    const dur = (3.2 + r()*2.4).toFixed(2);
    const delay = (-(r()*3)).toFixed(2);
    const isDraggingThis = dragState && dragState.id === c.id;
    const angle = dragAngles[c.id];
    const angleStyle = angle ? `transform:rotate(${angle.toFixed(1)}deg);` : '';
    const isOpp = c.stage === 'opportunity';
    const cls = 'bubble' + (isDraggingThis?' dragging':'') + (isOpp?' opp':'');
    const state = isOpp ? 'IN PIPELINE' : (c.status||'active').toUpperCase();
    const nameY = by + radius + 16;
    const stateY = nameY + 12;
    const coreDot = clamp(radius*0.16, 2, 5);
    const hlX = (bx-radius*0.3).toFixed(1), hlY = (by-radius*0.34).toFixed(1);
    const oppRing = isOpp ? `<circle cx="${bx}" cy="${by}" r="${(radius*0.52).toFixed(1)}" fill="none" stroke="${acc}" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2,3"/>` : '';
    return `<g class="${cls}" data-id="${c.id}" opacity="${gOp}" style="--dur:${dur}s; --delay:${delay}s; ${angleStyle}">
      <circle cx="${bx}" cy="${by}" r="${(radius*1.75).toFixed(1)}" fill="${acc}" opacity="0.15" filter="url(#nodeBlur)"/>
      <circle cx="${bx}" cy="${by}" r="${radius}" fill="none" stroke="${acc}" stroke-width="3" stroke-opacity="0.3" filter="url(#nodeBlur)"/>
      <circle class="core" cx="${bx}" cy="${by}" r="${radius}" fill="url(#orbCore)" stroke="${acc}" stroke-width="1.6" stroke-opacity="0.9"/>
      <ellipse cx="${hlX}" cy="${hlY}" rx="${(radius*0.42).toFixed(1)}" ry="${(radius*0.26).toFixed(1)}" fill="#ffffff" fill-opacity="0.1" transform="rotate(-25 ${hlX} ${hlY})"/>
      ${oppRing}
      <circle cx="${bx}" cy="${by}" r="${coreDot.toFixed(1)}" fill="${shade(acc,0.45)}"/>
      <text x="${bx}" y="${nameY.toFixed(1)}" text-anchor="middle" fill="#e8ecf8" font-family="Inter, sans-serif" font-size="11" font-weight="600" opacity="0.95">${c.name}</text>
      <text x="${bx}" y="${stateY.toFixed(1)}" text-anchor="middle" fill="${acc}" font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="1.4" opacity="0.9">${state}</text>
      <line x1="${(bx-14).toFixed(1)}" y1="${(stateY+6).toFixed(1)}" x2="${(bx+14).toFixed(1)}" y2="${(stateY+6).toFixed(1)}" stroke="${acc}" stroke-opacity="0.3" stroke-width="1"/>
    </g>`;
  }

  function renderTree(){
    const svg = document.getElementById('tree');
    const wrap = svg.parentElement;
    const rect = wrap.getBoundingClientRect();
    const H = 900;
    const aspect = rect.height > 0 ? (rect.width / rect.height) : 1.5;
    const W = clamp(Math.round(H * aspect), 900, 2400);
    const vbW = W/zoom, vbH = H/zoom;
    svg.setAttribute('viewBox', `${((W-vbW)/2).toFixed(1)} ${((H-vbH)/2).toFixed(1)} ${vbW.toFixed(1)} ${vbH.toFixed(1)}`);
    let parts = [];

    // vertical composition: canopy up top, ground in the middle, roots below
    const branchAnchorY = H*0.24;
    const trunkFork = { x: W/2, y: H*0.40 };
    const trunkBase = { x: W/2, y: H*0.66 };   // ground level
    const rootBandTop = H*0.72;
    const rootBandBottom = H*0.93;
    const totalVolume = Object.values(data.volumes).reduce((a,b)=>a+b,0) || 1;

    parts.push(`<defs>
      <radialGradient id="orbCore" cx="34%" cy="27%" r="82%">
        <stop offset="0%" stop-color="#2b3255"/>
        <stop offset="52%" stop-color="#141829"/>
        <stop offset="100%" stop-color="#090b14"/>
      </radialGradient>
      <linearGradient id="trunkGrad" gradientUnits="userSpaceOnUse" x1="0" y1="${trunkFork.y}" x2="0" y2="${trunkBase.y}">
        <stop offset="0%" stop-color="#6f7bc4"/>
        <stop offset="100%" stop-color="#2f3a63"/>
      </linearGradient>
      <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e6e9ff" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#8b7ff5" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#8b7ff5" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="nodeBlur" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
    </defs>`);

    // synaptic mesh backdrop (cached per canvas size)
    if (meshCache.w !== W || meshCache.h !== H){
      const mr = seededRandom(20260711);
      const pts = [];
      for (let i=0;i<84;i++) pts.push({ x:mr()*W, y:mr()*H });
      const thr = W*0.088, thr2 = thr*thr;
      let m = '<g class="mesh">';
      for (let i=0;i<pts.length;i++){
        for (let j=i+1;j<pts.length;j++){
          const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d2=dx*dx+dy*dy;
          if (d2 < thr2){
            const o = (1 - Math.sqrt(d2)/thr) * 0.14;
            m += `<line x1="${pts[i].x.toFixed(0)}" y1="${pts[i].y.toFixed(0)}" x2="${pts[j].x.toFixed(0)}" y2="${pts[j].y.toFixed(0)}" stroke="#5c68b0" stroke-opacity="${o.toFixed(3)}" stroke-width="0.6"/>`;
          }
        }
      }
      for (const p of pts) m += `<circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="1.1" fill="#7f8ad0" opacity="0.3"/>`;
      m += '</g>';
      meshCache = { w:W, h:H, str:m };
    }
    parts.push(meshCache.str);

    const order = ['enterprise','affiliate','founder'];
    const anchorX = { enterprise: W*0.22, affiliate: W*0.5, founder: W*0.78 };
    const rootAnchorX = { enterprise: W*0.26, affiliate: W*0.5, founder: W*0.74 };
    lastLayout = { W, H, rootAnchorX, rootBandTop, rootBandBottom, trunkBase };

    // ground line
    parts.push(`<line x1="40" y1="${trunkBase.y}" x2="${W-40}" y2="${trunkBase.y}" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>`);

    // faint decorative roots for soil texture
    const rootCount = clamp(Math.round(totalVolume/8), 5, 16);
    const rng = seededRandom(hashSeed('roots'));
    let deco = '';
    for (let i=0;i<rootCount;i++){
      const t = i/(rootCount-1 || 1);
      const spread = lerp(-W*0.34, W*0.34, t) + (rng()-0.5)*30;
      const endX = trunkBase.x + spread*0.9;
      const endY = lerp(rootBandTop, rootBandBottom, 0.5 + rng()*0.5);
      const c1 = { x: trunkBase.x + spread*0.15, y: trunkBase.y + 24 };
      const c2 = { x: trunkBase.x + spread*0.6, y: lerp(trunkBase.y, endY, 0.65) };
      deco += `<path d="${bezier(trunkBase,c1,c2,{x:endX,y:endY})}" stroke="#5c68b0" stroke-opacity="0.16" stroke-width="1.2" fill="none"/>`;
    }
    parts.push(deco);

    // trunk = a glowing conduit; information pulses flow down it from canopy to roots
    const trunkWidth = clamp(totalVolume/9, 9, 34);
    const trunkDown = `M ${trunkFork.x} ${trunkFork.y} C ${trunkFork.x+5} ${lerp(trunkFork.y,trunkBase.y,0.5)}, ${trunkBase.x-5} ${lerp(trunkFork.y,trunkBase.y,0.5)}, ${trunkBase.x} ${trunkBase.y}`;
    parts.push(`<path d="${trunkDown}" stroke="url(#trunkGrad)" stroke-opacity="0.22" stroke-width="${trunkWidth+10}" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>`);
    parts.push(`<path d="${trunkDown}" stroke="url(#trunkGrad)" stroke-width="${trunkWidth}" fill="none" stroke-linecap="round"/>`);
    parts.push(`<path d="${trunkDown}" stroke="#ffffff" stroke-opacity="0.06" stroke-width="${Math.max(2,trunkWidth*0.5)}" fill="none" stroke-linecap="round"/>`);
    parts.push(`<path class="flow" d="${trunkDown}" stroke="#e8ecff" stroke-opacity="0.92" stroke-width="${clamp(trunkWidth*0.32,2.5,7)}" fill="none" stroke-linecap="round" stroke-dasharray="3 21"/>`);

    // hub nodes at the fork and the base hide the seams and read as synapses
    let nodeParts = '';
    const forkR = clamp(trunkWidth*0.62, 9, 20);
    nodeParts += `<circle cx="${trunkFork.x}" cy="${trunkFork.y}" r="${forkR*1.7}" fill="url(#nodeGlow)"/>`;
    nodeParts += `<circle cx="${trunkFork.x}" cy="${trunkFork.y}" r="${forkR*0.5}" fill="#e6e9ff" fill-opacity="0.92"/>`;
    const baseR = clamp(trunkWidth*0.55, 8, 16);
    nodeParts += `<circle cx="${trunkBase.x}" cy="${trunkBase.y}" r="${baseR*1.7}" fill="url(#nodeGlow)"/>`;
    nodeParts += `<circle cx="${trunkBase.x}" cy="${trunkBase.y}" r="${baseR*0.45}" fill="#e6e9ff" fill-opacity="0.85"/>`;

    // ---- ROOTS: opportunities in the pipeline ----
    order.forEach(key=>{
      const ch = CHANNELS[key];
      const opps = data.clients.filter(c=>c.channel===key && c.stage==='opportunity');
      const n = opps.length;
      opps.forEach((c,i)=>{
        const r = seededRandom(hashSeed(c.id));
        const spacing = clamp(W*0.05, 34, 58);
        const baseX = rootAnchorX[key] + (i - (n-1)/2)*spacing + (r()-0.5)*18;
        const baseY = lerp(rootBandTop+12, rootBandBottom, 0.25 + r()*0.6);
        const bx = baseX + (c.dx||0);
        const by = baseY + (c.dy||0);
        const rc1 = { x: trunkBase.x + (bx-trunkBase.x)*0.25, y: trunkBase.y + 26 };
        const rc2 = { x: bx, y: by - 55 };
        const rootWidth = clamp(Number(c.value||1)/10, 1.2, 4.5);
        const isChurned = c.status === 'churned';
        const op = isChurned ? 0.3 : 1;
        const rootPath = bezier(trunkBase,rc1,rc2,{x:bx,y:by});
        parts.push(`<path d="${rootPath}" stroke="${ch.accent}" stroke-opacity="${op*0.4}" stroke-width="${rootWidth}" fill="none" stroke-linecap="round" stroke-dasharray="${isChurned?'4,3':'none'}"/>`);
        if (!isChurned){
          parts.push(`<path class="flow" d="${rootPath}" stroke="${shade(ch.accent,0.5)}" stroke-opacity="0.8" stroke-width="${clamp(rootWidth*0.7,1.6,3.5)}" fill="none" stroke-linecap="round" stroke-dasharray="3 21"/>`);
        }
        parts.push(bubbleMarkup(c, bx, by));
      });
    });

    // ---- CANOPY: branches + converted clients ----
    order.forEach(key=>{
      const ch = CHANNELS[key];
      const vol = data.volumes[key] || 0;
      const anchor = { x: anchorX[key], y: branchAnchorY };
      const branchWidth = clamp(vol/7, 3, 20);
      const c1 = { x: trunkFork.x, y: lerp(trunkFork.y, anchor.y, 0.3) };
      const c2 = { x: anchor.x, y: lerp(trunkFork.y, anchor.y, 0.8) };
      const branchUp = bezier(trunkFork,c1,c2,anchor);
      const branchDown = `M ${anchor.x} ${anchor.y} C ${c2.x} ${c2.y}, ${c1.x} ${c1.y}, ${trunkFork.x} ${trunkFork.y}`;
      parts.push(`<path d="${branchUp}" stroke="${ch.accent}" stroke-opacity="0.18" stroke-width="${branchWidth+8}" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>`);
      parts.push(`<path d="${branchUp}" stroke="${ch.accent}" stroke-opacity="0.6" stroke-width="${branchWidth}" fill="none" stroke-linecap="round"/>`);
      parts.push(`<path class="flow" d="${branchDown}" stroke="${shade(ch.accent,0.55)}" stroke-opacity="0.9" stroke-width="${clamp(branchWidth*0.4,2,5)}" fill="none" stroke-linecap="round" stroke-dasharray="3 21"/>`);

      parts.push(`<text x="${anchor.x}" y="${anchor.y + 30}" text-anchor="middle" fill="${ch.accent}" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" opacity="0.8">${ch.label.toUpperCase()} · ${vol}/wk</text>`);

      const clients = data.clients.filter(c=>c.channel===key && c.stage!=='opportunity');
      const n = clients.length;
      clients.forEach((c,i)=>{
        const r = seededRandom(hashSeed(c.id));
        const spacing = clamp(W*0.055, 40, 66);
        const baseX = anchor.x + (i - (n-1)/2)*spacing + (r()-0.5)*22;
        const normVal = clamp(Number(c.value||1)/50, 0, 1);
        const baseY = lerp(anchor.y - 52, H*0.06, normVal) + (r()-0.5)*16 - (i%2)*22;
        const bx = baseX + (c.dx||0);
        const by = baseY + (c.dy||0);

        const tc1 = { x: anchor.x + (bx-anchor.x)*0.3, y: anchor.y - 26 };
        const tc2 = { x: bx, y: by + 70 };
        const twigWidth = clamp(Number(c.value||1)/9, 1, 5.5);
        const isChurned = c.status === 'churned';
        const op = isChurned ? 0.28 : (c.status==='closing' ? 0.75 : 1);

        parts.push(`<path d="${bezier(anchor,tc1,tc2,{x:bx,y:by})}" stroke="${ch.accent}" stroke-opacity="${op*0.55}" stroke-width="${twigWidth}" fill="none" stroke-linecap="round" stroke-dasharray="${isChurned?'4,3':'none'}"/>`);
        parts.push(bubbleMarkup(c, bx, by));
      });
    });

    parts.push(nodeParts);

    svg.innerHTML = parts.join('');
  }

  // ---- drag: one set of handlers on the svg, survives re-renders ----
  function setupDrag(){
    const svg = document.getElementById('tree');
    svg.addEventListener('pointerdown', (e)=>{
      const g = e.target.closest && e.target.closest('.bubble');
      if (!g) return;
      const id = g.getAttribute('data-id');
      const client = data.clients.find(x=>x.id===id);
      if (!client) return;
      const start = toSvgPoint(svg, e.clientX, e.clientY);
      dragState = { id, startX:start.x, startY:start.y, lastX:start.x, startDx:client.dx||0, startDy:client.dy||0, moved:false };
      svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    svg.addEventListener('pointermove', (e)=>{
      if (!dragState) return;
      const cur = toSvgPoint(svg, e.clientX, e.clientY);
      const dX = cur.x - dragState.startX;
      const dY = cur.y - dragState.startY;
      if (Math.abs(dX) > 2 || Math.abs(dY) > 2) dragState.moved = true;
      const client = data.clients.find(x=>x.id===dragState.id);
      if (!client) return;
      const stepX = cur.x - dragState.lastX;
      dragState.lastX = cur.x;
      dragAngles[dragState.id] = clamp((dragAngles[dragState.id]||0)*0.6 + stepX*1.2, -20, 20);
      client.dx = dragState.startDx + dX;
      client.dy = dragState.startDy + dY;
      renderTree();
    });
    svg.addEventListener('pointerup', ()=>{
      if (!dragState) return;
      const id = dragState.id;
      const moved = dragState.moved;
      const client = data.clients.find(x=>x.id===id);
      dragState = null;
      delete dragAngles[id];

      // dropping an opportunity into another channel's zone re-connects it there
      if (client && client.stage==='opportunity' && moved && lastLayout){
        const el = svg.querySelector(`.bubble[data-id="${id}"] circle.core`);
        if (el){
          const absX = Number(el.getAttribute('cx'));
          let nearest = client.channel, best = Infinity;
          Object.keys(lastLayout.rootAnchorX).forEach(k=>{
            const d = Math.abs(absX - lastLayout.rootAnchorX[k]);
            if (d < best){ best = d; nearest = k; }
          });
          if (nearest !== client.channel){ client.channel = nearest; client.dx = 0; client.dy = 0; }
        }
      }

      renderTree();
      const g = svg.querySelector(`.bubble[data-id="${id}"]`);
      if (g && moved){
        g.classList.add('settle');
        g.addEventListener('animationend', ()=> g.classList.remove('settle'), { once:true });
      }
      if (!moved && client) showDetail(client);
      if (moved){ renderStats(); renderClientList(); }
      save();
    });
  }

  function renderAll(){
    renderChannelInputs();
    renderStats();
    renderClientList();
    renderTree();
  }

  document.getElementById('addForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    if (!name) return;
    const channel = document.getElementById('f-channel').value;
    const stage = document.getElementById('f-stage').value;
    const tactic = document.getElementById('f-tactic').value.trim();
    const value = Number(document.getElementById('f-value').value) || 1;
    const status = document.getElementById('f-status').value;
    data.clients.push({
      id: 'c-' + Date.now() + '-' + Math.floor(Math.random()*1000),
      name, channel, stage, tactic, value, status, dx:0, dy:0
    });
    e.target.reset();
    document.getElementById('f-value').value = 1;
    renderAll();
    save();
  });

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderTree, 120);
  });

  function buildEqualizer(){
    const eq = document.getElementById('equalizer');
    if (!eq) return;
    let bars = '';
    for (let i=0;i<18;i++){
      const delay = (-(Math.random()*1)).toFixed(2);
      const durv = (0.7 + Math.random()*0.7).toFixed(2);
      bars += `<i style="animation-delay:${delay}s; animation-duration:${durv}s"></i>`;
    }
    eq.innerHTML = bars;
  }

  function bindZoom(){
    const zin = document.getElementById('zoomIn');
    const zout = document.getElementById('zoomOut');
    if (zin) zin.addEventListener('click', ()=>{ zoom = clamp(zoom*1.18, 0.5, 3); renderTree(); });
    if (zout) zout.addEventListener('click', ()=>{ zoom = clamp(zoom/1.18, 0.5, 3); renderTree(); });
  }

  (async function init(){
    await load();
    setupDrag();
    bindDetailEditors();
    buildEqualizer();
    bindZoom();
    renderAll();
  })();
})();
</script>

</body>
</html>
